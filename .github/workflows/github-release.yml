name: GitHub release

# Publishes the GitHub release of a tag with generated notes; pass an image to name its digest in the notes.
on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag, e.g. image-release's image output. Empty leaves the image out of the notes.
        type: string
        default: ""
      digest:
        description: Digest of the image, e.g. image-release's digest output.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write the image into the notes
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          : > notes.md
          if [ -n "$IMAGE" ]; then
            [ -n "$DIGEST" ] || { echo "::error::image is set but digest is empty"; exit 1; }
            {
              echo "### Image"
              echo
              echo '```'
              echo "${IMAGE}:${GITHUB_REF_NAME#v}@${DIGEST}"
              echo '```'
            } >> notes.md
          fi

      # A suffixed tag is a pre-release, the same predicate image-release uses for :latest, so the two never disagree.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
