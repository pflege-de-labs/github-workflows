name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # actionlint checks every caller-facing contract it can: inputs, outputs, secrets and expressions.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=go depName=github.com/rhysd/actionlint
      ACTIONLINT_VERSION: v1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # shellcheck ships on the runner image, so actionlint also checks every run: script.
      - name: Lint the workflows
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}" -color
