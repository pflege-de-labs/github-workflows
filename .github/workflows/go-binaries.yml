name: Go release binaries

# Cross-compiles a command for a tag, attaches SBOMs and a signed checksum file, and publishes the GitHub release.
on:
  workflow_call:
    inputs:
      name:
        description: Binary name; assets are named <name>-<os>-<arch>.
        type: string
        required: true
      package:
        description: Package to build, e.g. ./cmd/teamster.
        type: string
        required: true
      targets:
        description: Whitespace-separated GOOS/GOARCH pairs.
        type: string
        default: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
      version-symbol:
        description: Variable the tag is linked into with -X.
        type: string
        default: main.version
      go-version:
        description: Go version to set up, e.g. "stable". Takes precedence over go-version-file.
        type: string
        default: ""
      go-version-file:
        description: File whose go/toolchain directive selects the Go version.
        type: string
        default: go.mod

permissions:
  contents: read

env:
  # Keyless certificates name the workflow that signed, which is this one, not the caller's.
  SIGNER_WORKFLOW: ^https://github\.com/pflege-de-labs/github-workflows/\.github/workflows/go-binaries\.yml@

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}

      - name: Build release binaries
        env:
          PACKAGE: ${{ inputs.package }}
          TARGETS: ${{ inputs.targets }}
          SYMBOL: ${{ inputs.version-symbol }}
        run: |
          mkdir -p dist
          for target in $TARGETS; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X ${SYMBOL}=${GITHUB_REF_NAME}" \
              -o "dist/${NAME}-${target%/*}-${target#*/}" "$PACKAGE"
          done

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # syft reads the Go build info the linker embeds (not stripped by -s -w), so the SBOM lists the exact module versions.
      - name: Generate an SBOM per binary
        run: |
          for binary in dist/"${NAME}"-*; do
            case "$binary" in *.spdx.json) continue ;; esac
            syft scan "file:${binary}" -o spdx-json > "${binary}.spdx.json"
          done

      # Checksums cover the binaries and their SBOMs, so signing this one file authenticates every release asset.
      - name: Checksum the assets
        run: (cd dist && sha256sum "${NAME}"-* > checksums.txt)

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # A bundle carries signature and certificate in one file, which cosign v3 requires of sign-blob.
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt

      - name: Verify the signature
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity-regexp "$SIGNER_WORKFLOW" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt

      # A suffixed tag is a pre-release, the same predicate image-release uses for :latest, so the two never disagree.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: dist/*
