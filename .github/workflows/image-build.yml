name: Image build

# Builds a commit's image for CI: tagged by commit, branch and PR, never :latest, which belongs to releases.
on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag. Defaults to ghcr.io/<owner>/<repo>.
        type: string
        default: ""
      context:
        description: Build context.
        type: string
        default: "."
      file:
        description: Dockerfile path. Empty uses <context>/Dockerfile.
        type: string
        default: ""
      platforms:
        description: Platforms to build.
        type: string
        default: linux/amd64,linux/arm64
      version:
        description: >-
          What the VERSION build arg carries: "sha" for the short commit, or "describe" for
          git describe against the release tags, e.g. v0.10.0-3-gabc1234.
        type: string
        default: sha
      describe-match:
        description: Tag glob git describe considers, so chart tags do not count as releases.
        type: string
        default: v[0-9]*
      build-args:
        description: Further build args, one KEY=value per line.
        type: string
        default: ""
      sign:
        description: Sign the pushed image with cosign, keyless.
        type: boolean
        default: true
    outputs:
      image:
        description: Image name without tag.
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: Digest of the built image index.
        value: ${{ jobs.image.outputs.digest }}
      pushed:
        description: '"true" when the image was pushed; fork PRs build only.'
        value: ${{ jobs.image.outputs.pushed }}
      short-sha:
        description: Short sha of the commit built, which is also an image tag.
        value: ${{ jobs.image.outputs.short-sha }}

permissions:
  contents: read

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      pushed: ${{ steps.push.outputs.enabled }}
      short-sha: ${{ steps.commit.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe needs the tags.
          fetch-depth: ${{ inputs.version == 'describe' && '0' || '1' }}

      # The registry path has to be lowercase, the owner does not have to be.
      - name: Resolve the image name
        id: name
        env:
          IMAGE: ${{ inputs.image }}
        run: echo "image=$(echo "${IMAGE:-ghcr.io/${GITHUB_REPOSITORY}}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Fork PRs get no registry credentials or OIDC token, so they build only and are not signed.
      - name: Decide whether the image can be pushed
        id: push
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # On pull_request HEAD is a merge commit that exists in no one's clone, so tag the head commit instead.
      - name: Resolve the commit being built
        id: commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERSION_FROM: ${{ inputs.version }}
          MATCH: ${{ inputs.describe-match }}
        run: |
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          case "$VERSION_FROM" in
            sha) echo "version=${SHA:0:7}" >> "$GITHUB_OUTPUT" ;;
            describe) echo "version=$(git describe --tags --always --match "$MATCH" "$SHA")" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::version must be sha or describe, not ${VERSION_FROM}"; exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.commit.outputs.short_sha }}
            type=ref,event=branch
            type=ref,event=pr

      # provenance: false avoids an extra "unknown/unknown" manifest on GHCR; releases carry full provenance.
      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ steps.push.outputs.enabled == 'true' }}
          build-args: |
            VERSION=${{ steps.commit.outputs.version }}
            ${{ inputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.sign && steps.push.outputs.enabled == 'true'

      # Keyless, by digest, so the signature covers every tag at once.
      - name: Sign the image
        if: inputs.sign && steps.push.outputs.enabled == 'true'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
