name: Renovate

# Self-hosted Renovate for the calling repository; its config is the repository's own renovate.json.
on:
  workflow_call:
    inputs:
      dry-run:
        description: Report what would change without opening pull requests.
        type: boolean
        default: false
      log-level:
        description: Renovate log level.
        type: string
        default: info
    secrets:
      RENOVATE_TOKEN:
        description: >-
          Token Renovate acts with. Not GITHUB_TOKEN: pull requests opened with the
          workflow token do not trigger CI, and automerge waits on those checks.
        required: true

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    # Two Renovate runs against one repository would fight over the same branches.
    concurrency:
      group: renovate-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log-level }}
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
